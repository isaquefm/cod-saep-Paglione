services:
  - type: web
    name: cod-saep-paglione-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: STOCK_ADMIN_USERNAME
        sync: false
      - key: STOCK_ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: APP_ORIGIN
        sync: false
